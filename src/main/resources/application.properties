# UYGULAMA BİLGİLERİ
spring.application.name=llm-data-discovery
server.port=8080

# SQLITE VERİTABANI BAĞLANTISI (Sistem Metadata)
spring.datasource.url=jdbc:sqlite:system_metadata.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HIBERNATE / JPA AYARLARI
# Veritabanı tablolarını sınıflara (Entity) bakarak otomatik oluştur veya güncelle
spring.jpa.hibernate.ddl-auto=update
# SQLite Dialect (Hibernate'in SQLite ile doğru konuşabilmesi için)
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# Çalışan SQL sorgularını konsolda görmek isterseniz true yapın
spring.jpa.show-sql=true

# GÜVENLİK (Basic Auth) - Python'daki .env'den aldığınız kısımlar
spring.security.user.name=admin
spring.security.user.password=secret

# OPENAI API KEY (Şimdilik properties'den alalım, ileride .env'ye geçirebilirsiniz)
openai.api.key=${OPENAI_API_KEY:your_openai_api_key_here}